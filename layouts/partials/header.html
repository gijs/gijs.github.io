<header class="sticky top-0 z-50 px-4 pt-3 pb-2" style="font-family: 'Inter', sans-serif;">
  <div class="max-w-5xl mx-auto">
    <div 
      class="flex items-center justify-between gap-4 px-3 h-14 rounded-full"
      style="backdrop-filter: blur(16px) saturate(1.15);box-shadow:inset 0 0 0 1px #3a32281a, inset 0 1px 0 #ffffff8c, 0 8px 24px #3a322814;width:fit-content;">

      <a href="/" class="flex items-center gap-3 group shrink-0">
        {{ $asset := resources.Get "images/gijs-sm.jpg" }}
        {{ if $asset }}
        {{ $img := $asset.Fill "80x80" }}
        <img src="{{ $img.RelPermalink }}" alt="Gijs Nijholt" class="w-9 h-9 rounded-full object-cover" />
        {{ end }}
        <span style="font-family: 'Playfair Display', Georgia, serif; font-size: 1.25rem; line-height: 1.2; font-weight: 700; color: #111;">Gijs Nijholt</span>
      </a>

    </div>
  </div>
</header>
